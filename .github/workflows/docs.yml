name: Deploy Sphinx Docs

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          sudo apt-get install -y dvipng
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-latex-recommended
          sudo apt-get install -y texlive-science texlive-fonts-recommended texlive-fonts-extra
          sudo apt-get install -y latexmk

      - name: Install Python dependencies
        run: |
          uv sync --extra docs

      - name: Clean notebook outputs
        run: |
          find . -name "*.ipynb" -exec uv run nbstripout {} \;

      - name: Build Sphinx docs
        run: |
          uv run sphinx-build -b html docs docs/_build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
